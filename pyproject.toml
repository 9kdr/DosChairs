[project]
name = "chair-workspace"
version = "0.1.0"
description = "Chair Python workspace (agent, sidecar, editor adapters)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "services/agent",
  "services/sidecar",
  "adapters/resolve",
  "adapters/kdenlive",
  "adapters/otio",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "adapters"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["services", "adapters", "scripts/demo-check"]
addopts = "-q --import-mode=importlib"

[tool.uv]
package = false
