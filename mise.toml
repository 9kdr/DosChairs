# Chair local toolchain — https://mise.jdx.dev
# Install mise, then from repo root: `mise install && mise run bootstrap`

min_version = "2024.11.0"

[tools]
node = "22"
python = "3.12"
pnpm = "9.15.0"
# Rust via rustup backend (needed for Tauri / crates)
rust = "1.91"
# Fast Python deps for agent + sidecar
uv = "0.5.14"

[env]
_.file = [".env"]
# Keep Python packages project-scoped when using uv
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
UV_LINK_MODE = "copy"
CHAIR_ROOT = "{{config_root}}"
TURBO_TELEMETRY_DISABLED = "1"

[settings]
experimental = true

# ── Tasks ──────────────────────────────────────────────────────────────────

[tasks.bootstrap]
description = "Install JS + Python workspace deps"
depends = ["install-js", "install-py"]
run = "echo 'Chair toolchain ready. Try: mise run dev'"

[tasks.install-js]
description = "pnpm install at workspace root"
run = "pnpm install"

[tasks.install-py]
description = "Sync the uv workspace"
run = "uv sync --all-packages --group dev"

[tasks.dev]
description = "Start the web UI (Vite). Use dev:desktop for the Tauri shell."
run = "pnpm --filter @chair/desktop dev"

[tasks."dev:desktop"]
description = "Start the Tauri shell. Needs WebKitGTK and a display on Linux."
run = """
runtime="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
if [ -z "${XDG_RUNTIME_DIR:-}" ] && [ -d "$runtime" ]; then
  export XDG_RUNTIME_DIR="$runtime"
fi
if [ -z "${WAYLAND_DISPLAY:-}" ] && [ -S "$runtime/wayland-0" ]; then
  export WAYLAND_DISPLAY=wayland-0
fi
if [ -z "${DISPLAY:-}" ] && [ -S /tmp/.X11-unix/X0 ]; then
  export DISPLAY=:0
fi
if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "$runtime/bus" ]; then
  export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
fi
pnpm --filter @chair/desktop dev:desktop
"""

[tasks."dev:agent"]
description = "Start agent runtime"
run = "uv run --package chair-agent python -m chair_agent"

[tasks."dev:sidecar"]
description = "Start model sidecar"
run = "uv run --package chair-sidecar python -m chair_sidecar"

[tasks."dev:stack"]
description = "Print the two commands for agent and sidecar"
run = "echo 'Run in two shells: mise run dev:agent  and  mise run dev:sidecar'"

[tasks.check]
description = "Typecheck, schema check, Python lint"
run = """
pnpm typecheck
pnpm test:schemas
uv run ruff check services adapters
"""

[tasks.test]
description = "JS, Python, and Rust tests (desktop crate excluded)"
run = """
pnpm test
uv run pytest
cargo test --workspace --exclude chair-desktop
"""

[tasks.fmt]
description = "Format JS/TS/JSON/MD"
run = "pnpm format"

[tasks.ci]
description = "Local CI mirror"
depends = ["check", "test"]
run = "echo 'ci ok'"

[tasks."export-ograf-sample"]
description = "Export the sample effect + React example as OGraf titles into /tmp/chair-ograf-sample"
run = """
set -e
rm -rf /tmp/chair-ograf-build
mkdir -p /tmp/chair-ograf-build
ROOT="$PWD"
OUT="$ROOT/packages/ograf/.tmp-export-ograf"
rm -rf "$OUT"
mkdir -p "$OUT"
pnpm --filter @chair/ograf exec esbuild "$ROOT/scripts/export-ograf.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-ograf.mjs" --tsconfig="$ROOT/scripts/tsconfig.json" --external:esbuild --log-level=warning
node "$OUT/export-ograf.mjs" --out /tmp/chair-ograf-sample
rm -rf "$OUT"
ls -la /tmp/chair-ograf-sample
"""

[tasks.codegen]
description = "Regenerate types from JSON schemas"
run = "pnpm codegen"
