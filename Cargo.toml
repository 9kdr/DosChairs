[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/cutroom-core",
  "crates/cutroom-ir",
  "crates/cutroom-adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/9kdr/DosChairs"
authors = ["Cutroom Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
