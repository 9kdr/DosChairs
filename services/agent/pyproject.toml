[project]
name = "chair-agent"
version = "0.1.0"
description = "Planner, executor, and verifier runtime"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
]

[project.scripts]
chair-agent = "chair_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chair_agent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
