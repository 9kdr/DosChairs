[project]
name = "chair-adapter-otio"
version = "0.1.0"
description = "OpenTimelineIO / FCPXML / EDL interchange. Broad compatibility, partial fidelity."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chair_otio"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
