[project]
name = "cutroom-adapter-resolve"
version = "0.1.0"
description = "DaVinci Resolve adapter. Requires Resolve Studio for the scripting API."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutroom_resolve"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
