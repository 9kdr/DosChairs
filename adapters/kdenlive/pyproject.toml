[project]
name = "chair-adapter-kdenlive"
version = "0.1.0"
description = "Kdenlive / MLT XML adapter. Linux-native fallback."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chair_kdenlive"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
