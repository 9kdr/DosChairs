[package]
name = "cutroom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cutroom desktop shell"
publish = false

[lib]
name = "cutroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
cutroom-core = { path = "../../../crates/cutroom-core" }
cutroom-ir = { path = "../../../crates/cutroom-ir" }
